[pytest]
# Config lives in tests/ so the suite writes nothing outside it:
# -p no:cacheprovider  -> no .pytest_cache directory anywhere
# -rfEsX               -> summary of failures, errors, skips, xpasses (known bugs: run with -rx)
# conftest.py also turns off .pyc writing for the source packages.
addopts = -rfEsX -p no:cacheprovider
markers =
    integration: needs a throwaway PostgreSQL with pgvector (MEMORY_NEXUS_TEST_DSN) and, for search tests, the local BGE-M3 model
filterwarnings =
    ignore::DeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning
